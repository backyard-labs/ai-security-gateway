model_list:
  - model_name: local-llama
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: os.environ/OLLAMA_API_BASE
      reasoning_effort: "none"

guardrails:
  - guardrail_name: "presidio-pii-guard"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      presidio_analyzer_api_base: "http://presidio-analyzer:3000"
      presidio_anonymizer_api_base: "http://presidio-anonymizer:3000"
      default_on: true

  - guardrail_name: "prompt-keyword-filter"
    litellm_params:
      guardrail: litellm_content_filter
      mode: "pre_call"
      default_on: true
      blocked_words:
        - keyword: "SYSTEM OVERRIDE"
          action: "BLOCK"
        - keyword: "AUTH_BYPASS"
          action: "BLOCK"
        - keyword: "Ignore all previous"
          action: "BLOCK"

litellm_settings:
  drop_params: true
  set_verbose: false
  callbacks: reasoning_policy.reasoning_policy

general_settings:
  database_url: os.environ/DATABASE_URL
  master_key: os.environ/LITELLM_MASTER_KEY
  